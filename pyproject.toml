[project]
name = "teambath"
version = "0.2.0"
description = "Use Team Bath's sports booking site (bookings.teambath.com) from Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel Werneck" }]
keywords = ["team-bath", "university-of-bath", "gladstone", "sports", "booking", "scraper"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/gwerneckp/teambath"
Issues = "https://github.com/gwerneckp/teambath/issues"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["assets/", "tests/fixtures/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real site (needs TEAMBATH_EMAIL and TEAMBATH_PIN)"]
